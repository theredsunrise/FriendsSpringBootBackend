server.port=8080
server.forward-headers-strategy=framework

spring.application.name=user-service
spring.jackson.time-zone=UTC
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.threads.virtual.enabled=true

springdoc.cache.disabled=true

ssl.truststore=${SSL_TRUSTSTORE_PASSWORD:changeit}
ssl.keystore=${SSL_KEYSTORE_PASSWORD:changeit}
ssl.key=${SSL_KEY_PASSWORD:changeit}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=redis

spring.ssl.bundle.jks.redis.key.alias=user-service
spring.ssl.bundle.jks.redis.key.password=${ssl.key}
spring.ssl.bundle.jks.redis.keystore.location=file:/etc/ssl/user-service/user-service.p12
spring.ssl.bundle.jks.redis.keystore.password=${ssl.keystore}
spring.ssl.bundle.jks.redis.keystore.type=PKCS12
spring.ssl.bundle.jks.redis.truststore.location=file:/etc/ssl/ca/ca-truststore.p12
spring.ssl.bundle.jks.redis.truststore.password=${ssl.truststore}
spring.ssl.bundle.jks.redis.truststore.type=PKCS12

spring.cache.type=redis
spring.cache.redis.time-to-live=20s
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=user-service::

spring.flyway.enabled=true
spring.flyway.execute-in-transaction=false
spring.flyway.baseline-on-migrate=true
spring.flyway.jdbc-properties.ssl=true
spring.flyway.jdbc-properties.sslmode=verify-full
spring.flyway.jdbc-properties.sslcert=/etc/ssl/user-service/user-service.crt
spring.flyway.jdbc-properties.sslkey=/etc/ssl/user-service/user-service.key
spring.flyway.jdbc-properties.sslrootcert=/etc/ssl/ca/ca.crt
spring.flyway.jdbc-properties.sslpassword=${ssl.key}

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_database}?binaryTransfer=true&prepareThreshold=5
spring.datasource.username=${DATASOURCE_USERNAME:db_user}
spring.datasource.password=${DATASOURCE_PASSWORD:db_secure_password}
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslcert=/etc/ssl/user-service/user-service.crt
spring.datasource.hikari.data-source-properties.sslkey=/etc/ssl/user-service/user-service.key
spring.datasource.hikari.data-source-properties.sslrootcert=/etc/ssl/ca/ca.crt
spring.datasource.hikari.data-source-properties.sslpassword=${ssl.key}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=30

spring.mvc.problemdetails.enabled=true
server.tomcat.max-connections=10000
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-keep-alive-requests=100

spring.jpa.show-sql=false
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#logging.level.org.apache.kafka.common.network=DEBUG
#logging.level.org.apache.kafka.common.security.ssl=DEBUG
#logging.level.org.springframework.kafka=DEBUG

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY}
spring.kafka.listener.ack-mode=record
spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.protocol=TLSv1.3
spring.kafka.properties.ssl.enabled.protocols=TLSv1.3
spring.kafka.properties.ssl.endpoint.identification.algorithm=HTTPS

spring.kafka.ssl.keystore-location=file:/etc/ssl/user-service/user-service.p12
spring.kafka.ssl.keystore-password=${ssl.keystore}
spring.kafka.ssl.keystore-type=PKCS12
spring.kafka.ssl.key-password=${ssl.key}

spring.kafka.ssl.truststore-location=file:/etc/ssl/user-service/user-service-truststore.p12
spring.kafka.ssl.truststore-password=${ssl.truststore}
spring.kafka.ssl.truststore-type=PKCS12

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.observation-enabled=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.template.observation-enabled=true

app.events.user-events-topic=${USER_EVENTS_TOPIC:user-events}
app.events.friendship-events-topic=${FRIENDSHIP_EVENTS_TOPIC:friendship-events}
app.events.response.user-events-topic=${USER_EVENTS_RESPONSE_TOPIC:user-events-response}
app.events.response.friendship-events-topic=${FRIENDSHIP_EVENTS_RESPONSE_TOPIC:friendship-events-response}

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.opentelemetry.enabled=true
management.tracing.sampling.probability=1.0
management.metrics.distribution.slo.http.server.requests=10ms,25ms,50ms,100ms,250ms,500ms,1s,2s

management.logging.export.otlp.enabled=true
management.tracing.export.otlp.enabled=true
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.enabled=true
management.observations.annotations.enabled=true
management.observations.enable.spring.security=false
spring.task.execution.propagate-context=true

jdbc.opentelemetry.enabled=true
jdbc.opentelemetry.spans.enabled=true
jdbc.includes=QUERY

#logging.level.io.opentelemetry=DEBUG
#logging.level.io.opentelemetry.sdk=DEBUG
#logging.level.io.opentelemetry.instrumentation=DEBUG
