spring.application.name=gateway

spring.cloud.gateway.server.webflux.trusted-proxies=

spring.cloud.gateway.server.webflux.x-forwarded.enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.for-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.host-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.port-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.proto-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.prefix-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.for-append=true
spring.cloud.gateway.server.webflux.x-forwarded.host-append=true
spring.cloud.gateway.server.webflux.x-forwarded.port-append=true
spring.cloud.gateway.server.webflux.x-forwarded.proto-append=true
spring.cloud.gateway.server.webflux.x-forwarded.prefix-append=true
spring.cloud.gateway.server.webflux.forwarded.enabled=true
spring.cloud.gateway.server.webflux.forwarded.by.enabled=true

#logging.level.org.springframework.cloud.gateway=TRACE
#logging.level.org.springframework.core.codec=TRACE
#logging.level.org.springframework.http.codec=TRACE
#logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=TRACE

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/main/v3/api-docs

springdoc.swagger-ui.urls[1].name=User Sync Service
springdoc.swagger-ui.urls[1].url=/replica/v3/api-docs

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.opentelemetry.enabled=true
management.tracing.sampling.probability=1.0
management.metrics.distribution.slo.http.server.requests=10ms,25ms,50ms,100ms,250ms,500ms,1s,2s

management.logging.export.otlp.enabled=true
management.tracing.export.otlp.enabled=true
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.enabled=true
management.observations.annotations.enabled=true
management.observations.enable.spring.security=false
spring.task.execution.propagate-context=true

spring.cloud.gateway.server.webflux.httpclient.pool.type=disabled
spring.config.import=classpath:users-gateway.properties,classpath:users-sync-gateway.properties,optional:configtree:/run/secrets/
